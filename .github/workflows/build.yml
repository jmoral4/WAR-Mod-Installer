name: Test and build Windows executable
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - name: Read package version
        id: version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WAR-Mod-Installer launch.pyw
      - name: Package documentation and checksum
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, SECURITY.md -Destination dist
          Copy-Item docs -Destination dist/docs -Recurse
          (Get-FileHash dist/WAR-Mod-Installer.exe -Algorithm SHA256).Hash + '  WAR-Mod-Installer.exe' | Set-Content dist/SHA256SUMS.txt
          Compress-Archive -Path dist/* -DestinationPath WAR-Mod-Installer-windows-x64.zip
          (Get-FileHash WAR-Mod-Installer-windows-x64.zip -Algorithm SHA256).Hash + '  WAR-Mod-Installer-windows-x64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WAR-Mod-Installer-windows-x64
          if-no-files-found: error
          path: |
            WAR-Mod-Installer-windows-x64.zip
            SHA256SUMS.txt

  release:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish the tested version-tag build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if ($env:RELEASE_TAG -cne "v$env:PACKAGE_VERSION" -or $env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tag must be vMAJOR.MINOR.PATCH and match pyproject.toml.'
          }
          gh run download $env:RUN_ID --name WAR-Mod-Installer-windows-x64 --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the tested build.' }
          $expectedHash = ((Get-Content release/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash release/WAR-Mod-Installer-windows-x64.zip -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Release ZIP checksum mismatch.'
          }
          gh release create $env:RELEASE_TAG release/WAR-Mod-Installer-windows-x64.zip release/SHA256SUMS.txt --verify-tag --title "WAR Mod Installer $env:RELEASE_TAG" --notes 'Unsigned Windows x64 build. Extract the ZIP and run WAR-Mod-Installer.exe. Read README.md and SECURITY.md before installing addons.'
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten.' }
